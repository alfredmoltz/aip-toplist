<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#0b1020;color:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.geo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.geo .flag{font-size:34px;line-height:1}
.geo .name{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#e7eaf3}
h1{margin:0 0 14px;text-align:center;font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-.02em}
.sub{margin:0 auto 30px;max-width:640px;text-align:center;color:#9aa4bd;font-size:15px}
.desc{margin:34px auto 0;max-width:760px;color:#9aa4bd;font-size:15px}
.card{position:relative;background:#131a2b;border:1px solid #1e2740;border-radius:16px;padding:18px;margin-bottom:22px}
.card.top{border-color:#e0a217;padding-top:26px}
.badge{position:absolute;top:-13px;left:16px;display:inline-flex;align-items:center;gap:6px;background:#f0b429;color:#20180a;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.brand{position:relative}
.pos{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:#0b1020;border:1px solid #2b3450;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.logobox{background:#1b2438;border:1px solid #26314d;border-radius:12px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.logobox img{max-width:88%;max-height:88px;height:auto;display:block}
.logotext{font-size:30px;font-weight:900;color:#f0b429;letter-spacing:-.02em}
.logoname{font-size:13px;font-weight:700;color:#e7eaf3;text-align:center}
.rating{margin-top:10px;text-align:center;font-size:14px;color:#9aa4bd}
.rating b{color:#fff}
.rating .star{color:#f0b429}
.info h2{margin:0 0 2px;font-size:19px;font-weight:800}
.blabel{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8f9ab4}
.bonus{margin:0;font-size:24px;font-weight:900;color:#8ce028;line-height:1.15}
.pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pay{background:#fff;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.cta{display:block;margin-top:16px;background:#8ce028;color:#10240a;text-align:center;font-size:16px;font-weight:800;text-decoration:none;padding:16px 18px;border-radius:10px;box-shadow:0 0 22px rgba(140,224,40,.35)}
.cta:hover{background:#9bf033}
footer{margin-top:36px;text-align:center;color:#7d879f;font-size:13px}
@media(min-width:760px){
.wrap{padding:36px 20px 64px}
h1{font-size:40px}
.grid{grid-template-columns:220px 1fr 200px;align-items:center;gap:20px}
.pays{margin-top:0}
.cta{margin-top:0}
.bonus{font-size:26px}
}</style>
</head>
<body>

</html>
